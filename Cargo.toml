[package]
name = "oplire-reset"
version = "3.0.0"
edition = "2021"
description = "OpenCode Proxy Pool Manager with automatic rate-limit rotation"
authors = ["Berke Oruc"]
license = "MIT"
repository = "https://github.com/berkeoruc/oplire"
homepage = "https://github.com/berkeoruc/oplire"

[[bin]]
name = "oplire"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
colored = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tokio = { version = "1", features = ["full", "process"] }
reqwest = { version = "0.12", features = ["json", "gzip", "brotli"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
